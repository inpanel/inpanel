name: Build RPM

on:
  workflow_call:

jobs:
  build:
    name: RPM
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [centos7, centos8, centos9]
    steps:
      - uses: actions/checkout@v4

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Build RPM for ${{ matrix.distro }}
        run: |
          DOCKER_TAG=$(echo ${{ matrix.distro }} | sed 's/centos7/7/;s/centos8/stream8/;s/centos9/stream9/')
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            quay.io/centos/centos:$DOCKER_TAG \
            /bin/bash -c "
              # CentOS 7/8/9 镜像均已 EOL，切换 yum/dnf 源到 vault
              if [ -d /etc/yum.repos.d ]; then
                sed -i 's|^mirrorlist=|#mirrorlist=|g' /etc/yum.repos.d/CentOS-*.repo 2>/dev/null || true
                sed -i 's|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo 2>/dev/null || true
                # CentOS Stream 8/9 的 vault 路径不同
                sed -i 's|http://vault.centos.org/\\\$contentdir|http://vault.centos.org/centos|g' /etc/yum.repos.d/CentOS-*.repo 2>/dev/null || true
              fi
              if command -v dnf >/dev/null 2>&1; then
                dnf clean all
                dnf install -y rpm-build python3 python3-pip python3-devel python3-setuptools make gcc
              else
                yum clean all
                yum install -y rpm-build python3 python3-pip python3-devel python3-setuptools python3-wheel make gcc
              fi
              python3 -m pip install build
              mkdir -p /rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              cp dist/*.tar.gz /rpmbuild/SOURCES/
              cp rpmbuild.spec /rpmbuild/SPECS/
              rpmbuild --define '_topdir /rpmbuild' -ba /rpmbuild/SPECS/rpmbuild.spec
              cp /rpmbuild/RPMS/noarch/*.rpm dist/
            "

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro }}
          path: dist/*.noarch.rpm
