name: Build DEB

on:
  workflow_call:

jobs:
  build:
    name: DEB Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python python3-all python3-setuptools pybuild-plugin-pyproject dpkg-dev

      - name: Build DEB package
        run: |
          # 生成 changelog
          VERSION=$(grep '^version =' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          cat > debian/changelog << EOF
          inpanel (${VERSION}-1) unstable; urgency=medium

            * Build from pyproject.toml version ${VERSION}

           -- Jackson Dou <jksdou@qq.com>  $(date -R)
          EOF

          # 清理残留缓存
          find . -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true

          # 构建
          dpkg-buildpackage -b -us -uc -d

          # 收集产物
          mkdir -p packages/deb
          cp ../*.deb packages/deb/

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/deb/*.deb
