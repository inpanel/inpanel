name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ============================================================
  # 源码分发包 (被所有后续 job 依赖)
  # ============================================================
  build-sdist:
    name: Build Source Distribution
    uses: ./.github/workflows/build-sdist.yml

  # ============================================================
  # pip 包 → PyPI
  # ============================================================
  publish-pypi:
    name: Publish to PyPI
    needs: build-sdist
    uses: ./.github/workflows/publish-pypi.yml
    secrets: inherit

  # ============================================================
  # DEB 包 → GitHub Release & APT 仓库
  # ============================================================
  build-deb:
    name: Build DEB
    needs: build-sdist
    uses: ./.github/workflows/build-deb.yml
    continue-on-error: true

  # ============================================================
  # RPM 包 → GitHub Release & YUM 仓库
  # ============================================================
  build-rpm:
    name: Build RPM
    needs: build-sdist
    uses: ./.github/workflows/build-rpm.yml
    continue-on-error: true

  # ============================================================
  # GitHub Release (汇集 DEB + RPM)
  # ============================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-deb, build-rpm]
    uses: ./.github/workflows/publish-release.yml
    secrets: inherit

  # ============================================================
  # 部署到 repo.inpanel.org (汇集 DEB + RPM)
  # ============================================================
  deploy-repo:
    name: Deploy to repo.inpanel.org
    needs: [build-deb, build-rpm]
    uses: ./.github/workflows/deploy-repo.yml
    secrets: inherit
